      <stop offset="0%" stop-color="#0c1412"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3db8a8"/>
      <stop offset="100%" stop-color="#f0c75e"/>
