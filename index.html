<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helana Log</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      max-width: 800px;
      padding: 3rem 1.5rem 1.5rem;
      text-align: center;
    }
    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: #8b949e; margin-top: 0.5rem; }
    .main-content { width: 100%; max-width: 800px; padding: 1.5rem; flex: 1; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #f0f6fc; }
    .card p { color: #8b949e; line-height: 1.6; }
    .card a { color: #58a6ff; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      background: #21262d;
      color: #58a6ff;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
    footer {
      width: 100%;
      max-width: 800px;
      padding: 1.5rem;
      text-align: center;
      color: #484f58;
      font-size: 0.85rem;
      border-top: 1px solid #21262d;
    }
  </style>
</head>
<body>
  <header>
    <h1>📝 Helana Log</h1>
    <p>학습 기록 · 문제 해결 · 일일 로그</p>
  </header>
  <div class="main-content">
    <div class="card">
      <h2>📂 개요</h2>
      <p>이 레포지토리는 학습 과정에서 발생한 문제 해결 기록, 일일 로그, 그리고 각종 메모를 저장하는 공간입니다.</p>
      <span class="badge">📅 2026-07-23 생성</span>
      <span class="badge">🔗 <a href="https://github.com/helena751107/helana_log">helena751107/helana_log</a></span>
    </div>
    <div class="card">
      <h2>🗣 댓글 / 게시판</h2>
      <div class="giscus"></div>
    </div>
  </div>
  <footer>
    <p>Helana Log · Powered by Claude Code + GitHub Pages</p>
  </footer>

  <!-- Giscus — GitHub Discussions 기반 댓글 -->
  <script src="https://giscus.app/client.js"
    data-repo="helena751107/helana_log"
    data-repo-id="R_kgDOTg3TCg"
    data-category="Announcements"
    data-category-id="DIC_kwDOTg3TCg4DBygA"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="dark"
    data-lang="ko"
    crossorigin="anonymous"
    async>
  </script>
</body>
</html>
